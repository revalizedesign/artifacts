<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Artifacts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://kit.fontawesome.com/bc93bab48d.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.10.7/dayjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.10.7/plugin/relativeTime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.10.7/plugin/isoWeek.min.js"></script>
    <script defer src="scripts.js"></script>
  </head>
  <body class="dark">
    <header>
      <h1>Artifacts</h1>
      <button class="view on" data-view="projects">Projects</button>
      <button class="view" data-view="days">Versions</button>
      <label id="inactive-toggle"><input type="checkbox" id="showInactive"> Show inactive</label>
    </header>
    <main>
      <section id="projects"></section>
      <section id="days" hidden></section>
    </main>
  </body>
</html>
